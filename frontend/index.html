<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Boğucu olmayan, çok ferah, pastel ve huzurlu bir arka plan (Açık gökyüzü / nane grisi) */
            background-color: #e9f0eb; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            font-family: 'Kalam', cursive; 
            margin: 0;
            min-height: 100vh;
        }

        .notepad {
            background-color: #ffffff; 
            width: 480px;
            min-height: 650px;
            box-shadow: 10px 10px 30px rgba(135, 148, 140, 0.2); /* Gölgeyi de yumuşattık */
            border-radius: 2px 15px 15px 2px;
            
            /* Klasik Öğrenci Defteri Çizgileri */
            background-image: 
                linear-gradient(90deg, transparent 70px, #ff8a8a 70px, #ff8a8a 72px, transparent 72px),
                linear-gradient(#cce0eb 1px, transparent 1px); /* Çizgi mavisini de hafiflettik */
            background-size: 100% 100%, 100% 45px;
            line-height: 45px;
            
            padding: 0 30px 30px 90px; 
            position: relative;
        }

        /* Başlık Alanı */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 25px;
            padding-bottom: 15px;
            height: 90px;
        }

        h2 {
            margin: 0;
            color: #4a4e54; /* Koyu kurşun kalem grafit rengi */
            font-size: 38px;
            font-weight: 700;
            line-height: 1;
        }

        .datetime-header {
            color: #8c9399; /* Açık kurşun kalem */
            font-size: 16px;
            text-align: right;
            line-height: 1.2;
        }

        /* Girdi Alanı */
        .input-area {
            display: flex;
            align-items: center;
            height: 45px;
        }

        input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 22px;
            font-family: 'Kalam', cursive;
            color: #4a4e54; /* Kurşun kalem grafit rengi */
            outline: none;
            height: 100%;
        }

        input::placeholder {
            color: #b5bbbf; /* Çok hafif silik kurşun kalem */
            opacity: 0.8;
        }

        button {
            background: none;
            border: 2px dashed #8c9399; 
            padding: 0 15px;
            border-radius: 8px;
            color: #4a4e54;
            font-family: 'Kalam', cursive;
            font-size: 18px;
            cursor: pointer;
            height: 35px;
            margin-left: 10px;
            transition: all 0.2s ease;
        }

        button:hover { 
            background-color: #f5f7f6; 
            border-color: #4a4e54;
        }

        /* Not Listesi */
        .note-item {
            display: flex;
            align-items: center;
            font-size: 22px;
            color: #4a4e54; /* Kurşun kalem grafit rengi */
            height: 45px; 
            border-bottom: 1px solid transparent; 
        }

        .checkbox {
            margin-right: 15px;
            cursor: pointer;
            width: 20px;
            height: 20px;
            margin-top: 5px;
            accent-color: #8c9399; /* Kurşun kalem rengi onay kutusu */
        }

        .note-text {
            flex: 1;
            transition: all 0.3s ease;
        }

        /* Görev tamamlandığında */
        .completed .note-text {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            color: #a3a9af; /* Silgiyle hafifçe silinmiş gibi soluk grafit */
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e67373; /* Yumuşak bir kırmızı kalem tonu */
            cursor: pointer;
            font-size: 20px;
            font-family: 'Kalam', cursive;
            opacity: 0; 
            transition: all 0.2s ease;
            height: 100%;
            padding: 0;
            margin-left: 10px;
        }

        .delete-btn:hover {
            color: #cc4c4c;
            font-weight: bold;
        }

        .note-item:hover .delete-btn {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="notepad">
        
        <div class="header-area">
            <h2>Daily Journal</h2>
            <div class="datetime-header" id="datetime">Yükleniyor...</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="noteInput" placeholder="Buraya karala...">
            <button onclick="addNote()">Ekle</button>
        </div>

        <div id="notesList"></div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/api/notes";

        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('tr-TR', options);
            const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('datetime').innerHTML = `${dateStr}<br>${timeStr}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        async function fetchNotes() {
            try {
                const response = await fetch(API_URL);
                const notes = await response.json();
                
                const notesList = document.getElementById("notesList");
                notesList.innerHTML = ""; 
                
                notes.forEach(note => {
                    const isChecked = note.is_completed ? "checked" : "";
                    const completedClass = note.is_completed ? "completed" : "";

                    notesList.innerHTML += `
                        <div class="note-item ${completedClass}">
                            <input type="checkbox" class="checkbox" ${isChecked} onchange="toggleNote(${note.id})">
                            <span class="note-text">${note.content}</span>
                            <button class="delete-btn" onclick="deleteNote(${note.id})">Sil</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Backend bağlantı hatası:", error);
            }
        }

        async function addNote() {
            const input = document.getElementById("noteInput");
            if (input.value.trim() === "") return;
            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: input.value })
            });
            input.value = ""; 
            fetchNotes(); 
        }

        async function toggleNote(id) {
            await fetch(`${API_URL}/${id}`, { method: "PUT" });
            fetchNotes();
        }

        async function deleteNote(id) {
            await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            fetchNotes(); 
        }

        document.getElementById("noteInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                addNote();
            }
        });

        fetchNotes();
    </script>
</body>
</html>
